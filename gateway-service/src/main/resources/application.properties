spring.application.name=gateway-service
server.port=8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# routes statiques : /api/customers/** et /api/accounts/**
spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webflux.routes[1].id=ebank-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EBANK-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/accounts/**

# routes dynamiques : /CUSTOMER-SERVICE/api/... et /EBANK-SERVICE/api/...
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
